<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DOMINO ARENA</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#07151c;--panel:#0e242b;--panel2:#15343a;--line:#2d5b5d;--gold:#e9b94b;--mint:#62e0bf;--red:#ef6c67;--text:#f5f3e9;--muted:#9db9b5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#23524e,#07151c 58%);font-family:Tahoma,Arial,sans-serif;color:var(--text);padding:15px}.app{width:min(1180px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.logo{font-weight:900;letter-spacing:3px;font-size:25px}.logo span{color:var(--gold)}.guest{font-size:12px;color:var(--muted);background:#102b32;border:1px solid var(--line);border-radius:20px;padding:8px 12px}.layout{display:grid;grid-template-columns:245px 1fr;gap:15px}.side,.main{background:linear-gradient(145deg,#123039ee,#0b2028ee);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #0005}.side{padding:17px}.side h3{font-size:14px;color:var(--muted);margin:2px 0 13px}.nav{display:grid;gap:8px}.nav button,.btn{border:1px solid #36666a;background:#153841;color:var(--text);border-radius:11px;padding:11px 12px;font:700 13px Tahoma;cursor:pointer}.nav button{text-align:right}.nav button.active,.btn.primary{background:linear-gradient(135deg,#ddb34e,#f4d477);color:#18231e;border-color:#ffe6a1}.nav button:hover,.btn:hover{border-color:var(--mint)}.side-note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:20px}.main{padding:15px;min-height:710px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.bar h1{font-size:22px;margin:0}.bar small{color:var(--muted)}.table{border:1px solid #315e5e;border-radius:17px;background:#07181e;padding:12px;min-height:230px;position:relative;overflow:hidden}.table:before{content:"";position:absolute;inset:10px;border:1px solid #194247;border-radius:13px;pointer-events:none}.chain{position:relative;z-index:1;display:flex;gap:7px;align-items:center;min-height:202px;overflow-x:auto;padding:22px 8px;direction:ltr}.empty-board{text-align:center;color:var(--muted);width:100%;font-size:13px}.dom{width:48px;height:92px;flex:0 0 48px;border-radius:8px;background:#f4f0dc;color:#172b2b;border:2px solid #c4b982;display:flex;flex-direction:column;justify-content:space-around;align-items:center;position:relative;box-shadow:0 4px 0 #8b7c4a,0 7px 15px #0005}.dom:after{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:2px solid #b9ad7d}.dom span{font-size:19px;font-weight:900;line-height:1;z-index:1}.hand-area{margin-top:13px;background:#102a31;border:1px solid var(--line);border-radius:15px;padding:13px}.hand-title{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.hand{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 9px;min-height:102px}.hand .dom{cursor:pointer;transition:.18s}.hand .dom:hover{transform:translateY(-8px);border-color:var(--gold)}.hand .dom.selected{transform:translateY(-10px);border-color:var(--mint);box-shadow:0 0 0 3px #62e0bf44,0 6px 0 #8b7c4a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.hint{color:var(--muted);font-size:12px;line-height:1.7;margin-top:9px}.scoreline{display:flex;gap:8px;margin-bottom:10px}.scorebox{flex:1;background:#102a31;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;color:var(--muted);font-size:11px}.scorebox b{display:block;color:var(--gold);font-size:18px;margin-top:3px}.screen{min-height:650px;border-radius:15px;display:flex;justify-content:center;align-items:center;text-align:center;padding:25px;background:linear-gradient(#07161dcc,#07161dcc),radial-gradient(circle at 50% 25%,#27625b,#081a20 66%)}.screen h1{font-size:35px;margin:8px 0 10px}.screen p{color:#d1dfd9;line-height:1.9;margin:8px 0 20px}.form{width:min(390px,100%);text-align:right}.input{width:100%;background:#07171d;border:1px solid #356165;color:var(--text);border-radius:10px;padding:12px;font:14px Tahoma;margin:5px 0 10px}.form label{font-size:12px;color:var(--muted)}.actions.center{justify-content:center}.room{font:900 31px monospace;letter-spacing:6px;direction:ltr;color:var(--gold);background:#07171d;border:1px solid var(--line);border-radius:12px;padding:13px 18px;margin:15px 0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #285052;padding:13px 4px}.row b{color:var(--gold)}.hidden{display:none!important}.danger{color:#ffd7d6!important;border-color:#854a4b!important}@media(max-width:760px){body{padding:9px}.layout{display:block}.side{margin-bottom:10px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;font-size:11px;padding:10px 4px}.side-note{display:none}.main{min-height:650px;padding:10px}.table{min-height:205px}.dom{width:43px;height:82px;flex-basis:43px}.dom span{font-size:17px}.screen{min-height:600px}}
</style></head>
<body><main class="app"><header class="top"><div class="logo">DOMINO <span>ARENA</span></div><div class="guest" id="guest">Guest • جاري الاتصال</div></header><section class="layout"><aside class="side"><h3>القائمة الرئيسية</h3><nav class="nav"><button data-mode="ai" class="active">ضد الكمبيوتر</button><button data-mode="online">أونلاين</button><button data-mode="scores">الترتيب</button></nav><div class="side-note">لعبة دومينو كاملة بنظام السحب والحجب. العب كضيف، اختر قطعة ثم اختر طرف السلسلة المناسب. في الأونلاين أنشئ غرفة وشارك الكود مع خصمك.</div></aside><section class="main"><div class="bar"><h1 id="heading">دومينو ضد الكمبيوتر</h1><small id="sub">Classic Draw & Block</small></div><div id="view"></div></section></section></main>
<script>
(()=>{
const firebaseConfig={apiKey:'AIzaSyBFyORpVWPjxpHcnS0UVfRbTictRQPl8aQ',authDomain:'ebraa-f53bb.firebaseapp.com',projectId:'ebraa-f53bb',storageBucket:'ebraa-f53bb.firebasestorage.app',messagingSenderId:'1042267482279',appId:'1:1042267482279:web:5f93cae979492b31b71382'};
let db=null,online=false,uid='guest-'+Math.random().toString(36).slice(2),unsubscribe=null,mode='ai',room='',name=localStorage.getItem('domino-name')||'Guest';
const view=document.getElementById('view'),heading=document.getElementById('heading'),sub=document.getElementById('sub'),guest=document.getElementById('guest');
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();firebase.auth().signInAnonymously().then(r=>{uid=r.user.uid;online=true;guest.textContent='Guest • '+name}).catch(()=>guest.textContent='Guest • وضع محلي')}catch(e){guest.textContent='Guest • وضع محلي'}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const setTitle=(a,b)=>{heading.textContent=a;sub.textContent=b};
const saveName=()=>{name=(document.getElementById('name')?.value||'Guest').trim().slice(0,18)||'Guest';localStorage.setItem('domino-name',name);guest.textContent='Guest • '+name};
const tile=(a,b,extra='')=>`<div class="dom ${extra}"><span>${a}</span><span>${b}</span></div>`;
const makeSet=()=>{let d=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push([a,b]);return d};
const shuffle=d=>d.sort(()=>Math.random()-.5);
function menu(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function home(){setTitle('دومينو ضد الكمبيوتر','Classic Draw & Block');view.innerHTML=`<div class="screen"><div><div style="font-size:76px">🁣</div><h1>DOMINO ARENA</h1><p>اختبر مهارتك في الدومينو ضد الكمبيوتر.<br>الهدف: تخلّص من قطعك قبل الخصم.</p><div class="form"><label>اسم اللاعب</label><input id="name" class="input" value="${esc(name)}" maxlength="18"></div><div class="actions center"><button id="play" class="btn primary">ابدأ مباراة</button><button id="onlineBtn" class="btn">مباراة أونلاين</button></div></div></div>`;document.getElementById('name').onchange=saveName;document.getElementById('play').onclick=()=>{saveName();startLocal()};document.getElementById('onlineBtn').onclick=()=>{mode='online';menu();render()}}
function onlineHome(){setTitle('دومينو أونلاين','غرفة خاصة ضد لاعب حقيقي');view.innerHTML=`<div class="screen"><div class="form"><div style="font-size:66px;text-align:center">🁫</div><h1 style="text-align:center">مباراة أونلاين</h1><p style="text-align:center">أنشئ غرفة وشارك الكود مع صديقك أو ادخل كود غرفة موجودة.</p><label>اسم اللاعب</label><input id="name" class="input" value="${esc(name)}" maxlength="18"><div class="actions center"><button id="create" class="btn primary">إنشاء غرفة</button><button id="showJoin" class="btn">دخول غرفة</button></div><input id="code" class="input hidden" placeholder="كود الغرفة من 6 أحرف" maxlength="6" style="text-align:center;letter-spacing:5px;text-transform:uppercase;direction:ltr"><button id="join" class="btn primary hidden" style="width:100%">دخول</button><p id="net" style="font-size:12px">${online?'متصل بالخدمة':'الخدمة غير متصلة'}</p></div></div>`;document.getElementById('name').onchange=saveName;document.getElementById('create').onclick=()=>{saveName();createRoom()};document.getElementById('showJoin').onclick=()=>{document.getElementById('code').classList.remove('hidden');document.getElementById('join').classList.remove('hidden');document.getElementById('showJoin').classList.add('hidden')};document.getElementById('join').onclick=()=>{saveName();joinRoom(document.getElementById('code').value.trim().toUpperCase())}}
async function createRoom(){if(!online)return alert('الاتصال بالأونلاين غير متاح الآن');room=Math.random().toString(36).slice(2,8).toUpperCase();await db.collection('dominoRooms').doc(room).set({status:'waiting',host:uid,createdAt:Date.now(),players:{[uid]:{name,seat:0}}});lobby()}
async function joinRoom(code){if(!online)return alert('الاتصال بالأونلاين غير متاح الآن');if(!/^[A-Z0-9]{6}$/.test(code))return alert('اكتب كودًا من 6 أحرف');let ref=db.collection('dominoRooms').doc(code),s=await ref.get();if(!s.exists)return alert('الغرفة غير موجودة');room=code;await ref.set({status:'playing',players:{[uid]:{name,seat:1}}},{merge:true});lobby()}
function lobby(){
  let launched=false;
  setTitle('الغرفة '+room,'في انتظار الخصم');
  view.innerHTML=`<div class="screen"><div><div style="font-size:66px">🏆</div><h1>شارك كود المباراة</h1><div class="room">${room}</div><p id="wait">في انتظار لاعب آخر…</p><button id="leave" class="btn danger">خروج</button></div></div>`;
  document.getElementById('leave').onclick=()=>{if(unsubscribe)unsubscribe();unsubscribe=null;mode='online';render()};
  unsubscribe=db.collection('dominoRooms').doc(room).onSnapshot(snap=>{
    const d=snap.data()||{}, p=Object.entries(d.players||{});
    if(p.length<2)return;
    document.getElementById('wait').textContent='تم العثور على الخصم، جاري توزيع القطع…';
    let state=d.game;
    if(!state&&d.host===uid){
      state=deal();
      db.collection('dominoRooms').doc(room).set({game:state,status:'playing'},{merge:true});
    }
    if(state&&!launched){launched=true;setTimeout(()=>startOnline(state),600)}
  });
}

function deal(){let deck=shuffle(makeSet()),hands=[deck.splice(0,7),deck.splice(0,7)];return{deck,hand0:hands[0],hand1:hands[1],board:[],turn:0,started:false,over:false,winner:null,score:[0,0],ts:Date.now()}}
function playable(t,b){return !b.length||t[0]===b[0]||t[1]===b[0]||t[0]===b[b.length-1]||t[1]===b[b.length-1]}
function orient(t,side,b){if(!b.length)return t;if(side==='L')return t[1]===b[0]?[t[0],t[1]]:t[0]===b[0]?[t[1],t[0]]:null;return t[0]===b[b.length-1]?[t[0],t[1]]:t[1]===b[b.length-1]?[t[1],t[0]]:null}
function sum(h){return h.reduce((n,t)=>n+t[0]+t[1],0)}
function startLocal(){if(unsubscribe){unsubscribe();unsubscribe=null}let state=deal();runGame(state,0,false)}
function startOnline(state){if(unsubscribe){unsubscribe();unsubscribe=null}runGame(state,state.host===uid?0:1,true)}
function runGame(state,seat,isOnline){let selected=-1,aiTimer=null;const save=s=>{state=s;if(isOnline)db.collection('dominoRooms').doc(room).set({game:state},{merge:true})};function renderGame(msg=''){let hand=state['hand'+seat]||[],opp=state['hand'+(seat?0:1)]||[];setTitle(isOnline?'دومينو أونلاين':'دومينو ضد الكمبيوتر',state.turn===seat?'دورك الآن':'دور الخصم');view.innerHTML=`<div class="scoreline"><div class="scorebox">أنت<b>${sum(hand)}</b></div><div class="scorebox">النقاط<b>${state.score[seat]||0} - ${state.score[seat?0:1]||0}</b></div><div class="scorebox">الخصم<b>${opp.length} قطعة</b></div></div><div class="table"><div class="chain">${state.board.length?state.board.map(t=>tile(t[0],t[1])).join(''):'<div class="empty-board">اسحب قطعة لبدء السلسلة</div>'}</div></div><div class="hand-area"><div class="hand-title"><span>قطعك (${hand.length})</span><span>${state.turn===seat?'اختر قطعة ثم الطرف':'انتظر دور الخصم'}</span></div><div class="hand">${hand.map((t,i)=>tile(t[0],t[1],i===selected?'selected':'' )).join('')}</div><div class="actions"><button id="left" class="btn">ضع يسار</button><button id="right" class="btn">ضع يمين</button><button id="draw" class="btn">اسحب من المخزن (${state.deck.length})</button><button id="new" class="btn danger">استسلام</button></div><div class="hint">${msg||'القطعة المضيئة هي المختارة. يمكن وضعها فقط إذا تطابق أحد طرفيها مع السلسلة.'}</div></div>`;document.querySelectorAll('.hand .dom').forEach((el,i)=>el.onclick=()=>{if(state.turn===seat){selected=i;renderGame()}});document.getElementById('left').onclick=()=>play('L');document.getElementById('right').onclick=()=>play('R');document.getElementById('draw').onclick=draw;document.getElementById('new').onclick=()=>finish(seat?0:1);function play(side){if(state.turn!==seat||selected<0)return renderGame('اختر قطعة من يدك أولًا.');let hand=state['hand'+seat],t=hand[selected],o=orient(t,side,state.board);if(!o)return renderGame('هذه القطعة لا تناسب الطرف المختار.');hand.splice(selected,1);if(side==='L')state.board.unshift(o);else state.board.push(o);selected=-1;state.started=true;if(!hand.length){finish(seat);return}state.turn=seat?0:1;save(state);renderGame();if(!isOnline&&state.turn===1)setTimeout(aiMove,650)}function draw(){if(state.turn!==seat)return;if(state.deck.length){state['hand'+seat].push(state.deck.pop());save(state);renderGame('تم سحب قطعة.')}else if(!state['hand'+seat].some(t=>playable(t,state.board))){state.turn=seat?0:1;save(state);renderGame('لا توجد حركة، تم تمرير الدور.');if(!isOnline&&state.turn===1)setTimeout(aiMove,650)}}function aiMove(){if(state.over||state.turn!==1)return;let h=state.hand1,idx=h.findIndex(t=>playable(t,state.board));if(idx<0&&state.deck.length){h.push(state.deck.pop());save(state);setTimeout(aiMove,500);return}if(idx<0){state.turn=0;save(state);renderGame('الكمبيوتر مرّر الدور.');return}let t=h.splice(idx,1)[0],o=orient(t,'R',state.board)||orient(t,'L',state.board);if(!o){h.splice(idx,0,t);state.turn=0}else{if(!state.board.length||orient(t,'R',state.board))state.board.push(o);else state.board.unshift(o);if(!h.length){finish(0);return}state.turn=0}save(state);renderGame()}function finish(w){state.over=true;state.winner=w;let points=sum(state['hand'+(w?0:1)]);state.score[w]+=points;if(isOnline&&db)db.collection('dominoScores').add({name,score:state.score[w],mode:'online',createdAt:Date.now()}).catch(()=>{});view.innerHTML=`<div class="screen"><div><div style="font-size:70px">${w===seat?'🏆':'🁢'}</div><h1>${w===seat?'أحسنت، فزت!':'انتهت المباراة'}</h1><p>النقاط: <b style="color:var(--gold);font-size:25px">${state.score[w]}</b></p><div class="actions center"><button id="again" class="btn primary">مباراة جديدة</button><button id="back" class="btn">القائمة</button></div></div></div>`;document.getElementById('again').onclick=()=>isOnline?lobby():startLocal();document.getElementById('back').onclick=()=>{mode=isOnline?'online':'ai';render()}}renderGame();if(isOnline)unsubscribe=db.collection('dominoRooms').doc(room).onSnapshot(s=>{let d=s.data()||{};if(d.game){state=d.game;if(!state.over)renderGame()}})}
}
function scores(){setTitle('الترتيب','أفضل نتائج Domino Arena');view.innerHTML='<div class="screen"><div style="width:min(550px,100%)"><div style="font-size:65px">🏆</div><h1>أفضل اللاعبين</h1><p id="msg">جاري تحميل النتائج…</p><div id="rows"></div><button id="back" class="btn">رجوع</button></div></div>';document.getElementById('back').onclick=()=>{mode='ai';render()};if(!online){document.getElementById('msg').textContent='الترتيب يحتاج اتصال Firebase';return}db.collection('dominoScores').orderBy('score','desc').limit(10).get().then(s=>{document.getElementById('msg').textContent='';document.getElementById('rows').innerHTML=s.docs.map((d,i)=>`<div class="row"><span>${i+1}. ${esc(d.data().name||'Guest')}</span><b>${d.data().score||0}</b></div>`).join('')||'<p>لا توجد نتائج بعد.</p>'}).catch(()=>document.getElementById('msg').textContent='تعذر تحميل النتائج')}
function render(){menu();if(mode==='ai')home();else if(mode==='online')onlineHome();else scores()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});render();
})();
</script></body></html>
