<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سباق الطريق</title>
<style>
:root{--bg:#08111f;--panel:#101d31;--accent:#ffcc3d;--text:#f6f8fb;--muted:#9eacc1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1d3c62 0,#08111f 52%);font-family:Tahoma,Arial,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;padding:18px;overflow:hidden}
.wrap{width:min(430px,100%);text-align:center}.brand{font-weight:900;font-size:25px;letter-spacing:.3px;margin-bottom:10px}.brand span{color:var(--accent)}
.hud{display:flex;justify-content:space-between;align-items:center;background:rgba(16,29,49,.9);border:1px solid #2a3c57;border-radius:16px;padding:10px 15px;margin-bottom:10px;font-size:14px}.hud b{display:block;font-size:20px;color:var(--accent);margin-top:2px}.hud small{color:var(--muted)}
.gamebox{position:relative;border:4px solid #2c405b;border-radius:20px;overflow:hidden;background:#26333b;box-shadow:0 20px 50px #0008}.gamebox canvas{display:block;width:100%;height:auto;aspect-ratio:9/14;background:#2a3438}.screen{position:absolute;inset:0;background:#07101dcc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px}.screen h1{font-size:31px;margin:0 0 10px}.screen p{color:#d4dceb;line-height:1.8;margin:5px 0 18px}.screen.hidden{display:none}.btn{border:0;border-radius:13px;padding:13px 28px;font:700 16px Tahoma;cursor:pointer;background:var(--accent);color:#20251e;box-shadow:0 5px 0 #b18816}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b18816}.controls{display:flex;direction:ltr;justify-content:center;gap:22px;margin-top:14px}.control{width:78px;height:54px;border-radius:15px;border:1px solid #435979;background:#162943;color:#fff;font-size:27px;font-weight:bold;touch-action:none;user-select:none}.hint{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">سباق <span>الطريق</span></div>
  <div class="hud"><div><small>النقاط</small><b id="score">0</b></div><div><small>أفضل نتيجة</small><b id="best">0</b></div><div><small>السرعة</small><b id="speed">1</b></div></div>
  <section class="gamebox"><canvas id="game" width="360" height="560"></canvas><div id="screen" class="screen"><h1 id="screenTitle">جاهز للسباق؟</h1><p id="screenText">تحرك يمينًا ويسارًا وتجنب السيارات.<br>استخدم الأسهم أو أزرار التحكم.</p><button id="start" class="btn">ابدأ اللعب</button></div></section>
  <div class="controls"><button class="control" id="left" aria-label="يسار">◀</button><button class="control" id="right" aria-label="يمين">▶</button></div>
  <div class="hint">التحكم: الأسهم ← → أو A / D · اضغط مسافة للإيقاف المؤقت</div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed'),screen=document.getElementById('screen'),title=document.getElementById('screenTitle'),text=document.getElementById('screenText'),start=document.getElementById('start');
let best=Number(localStorage.getItem('road-race-best')||0),running=false,paused=false,score=0,roadOffset=0,last=0,spawn=0,player,traffic=[]; bestEl.textContent=best;
const colors=['#ef5350','#42a5f5','#ab47bc','#ff7043','#26a69a'];
function reset(){score=0;roadOffset=0;spawn=0;traffic=[];player={x:W/2-22,y:H-92,w:44,h:70,speed:250};scoreEl.textContent=0;speedEl.textContent=1}
function road(){x.fillStyle='#28733f';x.fillRect(0,0,W,H);x.fillStyle='#333b41';x.fillRect(43,0,W-86,H);x.fillStyle='#d5d8c8';x.fillRect(43,0,5,H);x.fillRect(W-48,0,5,H);x.fillStyle='#f5f1c8';for(let y=-40+(roadOffset%70);y<H;y+=70){x.fillRect(W/2-3,y,6,38)}}
function car(o,main){x.save();x.translate(o.x,o.y);x.fillStyle='#1119';x.fillRect(3,8,o.w-6,o.h-2);x.fillStyle=main?'#ffd740':o.color;x.beginPath();x.roundRect(0,0,o.w,o.h,9);x.fill();x.fillStyle='#1a2732';x.fillRect(7,12,o.w-14,19);x.fillRect(7,o.h-27,o.w-14,12);x.fillStyle='#fff8';x.fillRect(4,6,7,9);x.fillRect(o.w-11,6,7,9);x.fillStyle='#222';x.fillRect(-3,15,5,17);x.fillRect(o.w-2,15,5,17);x.fillRect(-3,o.h-25,5,17);x.fillRect(o.w-2,o.h-25,5,17);x.restore()}
function hit(a,b){return a.x+6<b.x+b.w-6&&a.x+a.w-6>b.x+6&&a.y+8<b.y+b.h-8&&a.y+a.h-8>b.y+8}
function spawnCar(){let lane=[74,136,198,260][Math.floor(Math.random()*4)];traffic.push({x:lane,y:-82,w:44,h:70,color:colors[Math.floor(Math.random()*colors.length)],v:145+score*.35})}
function frame(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;if(!paused){let level=1+Math.floor(score/500);speedEl.textContent=level;roadOffset+=145*dt+score*.05*dt;spawn-=dt;if(spawn<=0){spawnCar();spawn=Math.max(.38,1.02-score/5000)}traffic.forEach(o=>o.y+=o.v*dt);traffic=traffic.filter(o=>o.y<H+90);if(traffic.some(o=>hit(player,o))){end();return}score+=Math.floor(dt*12);scoreEl.textContent=score;draw()}requestAnimationFrame(frame)}
function draw(){road();traffic.forEach(o=>car(o,false));car(player,true)}
function end(){running=false;if(score>best){best=score;localStorage.setItem('road-race-best',best);bestEl.textContent=best}title.textContent='انتهى السباق';text.innerHTML='نتيجتك: <b>'+score+'</b><br>حاول تحط رقمًا جديدًا!';start.textContent='إعادة اللعب';screen.classList.remove('hidden')}
function begin(){reset();running=true;paused=false;screen.classList.add('hidden');last=performance.now();requestAnimationFrame(frame)}
function move(dir){if(running&&!paused)player.x=Math.max(55,Math.min(W-55-player.w,player.x+dir*player.speed*.09))}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(e.key===' '&&running){paused=!paused;title.textContent=paused?'متوقف مؤقتًا':'جاهز للسباق؟';text.textContent=paused?'اضغط مسافة للمتابعة':'';screen.classList.toggle('hidden',!paused)}});[['left',-1],['right',1]].forEach(([id,d])=>{let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();move(d)});b.addEventListener('pointerup',e=>e.preventDefault())});start.onclick=begin;reset();draw();
})();
</script>
</body>
</html>
