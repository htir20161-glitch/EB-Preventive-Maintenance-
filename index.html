<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road Rivals | سباق الطريق</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#07111f;--panel:#101d30;--panel2:#162942;--line:#294361;--gold:#ffd447;--cyan:#56d6e8;--red:#ff6072;--text:#f5f7fb;--muted:#9dafc6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -12%,#244f76 0,#07111f 53%);font-family:Tahoma,Arial,sans-serif;color:var(--text);padding:18px;display:flex;justify-content:center}.app{width:min(1050px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:27px;font-weight:900}.logo span{color:var(--gold)}.guest{font-size:12px;color:var(--muted);background:#112238;border:1px solid var(--line);border-radius:20px;padding:8px 12px}.page{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel,.game-card{background:linear-gradient(145deg,#13243aee,#0e1a2cee);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px #0004}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 14px}.menu{display:grid;gap:9px}.menu button,.btn{border:1px solid #385473;background:#182e4a;color:var(--text);border-radius:12px;padding:12px 13px;font:700 14px Tahoma;cursor:pointer;text-align:right}.menu button:hover,.btn:hover{border-color:var(--cyan);background:#203b5d}.menu button.active{background:linear-gradient(90deg,#1b4560,#254d63);border-color:var(--cyan)}.help{color:var(--muted);font-size:12px;line-height:1.8;margin-top:18px}.game-card{padding:16px}.mode-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mode-title h1{font-size:22px;margin:0}.mode-title small{color:var(--muted)}.screen{min-height:630px;display:flex;justify-content:center;align-items:center;text-align:center;background:linear-gradient(#07111d88,#07111dcc),radial-gradient(circle at 50% 20%,#1b4860,#091624 65%);border-radius:16px;padding:24px}.screen h1{font-size:34px;margin:0 0 10px}.screen p{color:#d5deeb;line-height:1.9;margin:8px 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.primary{background:var(--gold)!important;color:#1e261c!important;border-color:#ffe47d!important}.danger{color:#ffdbe0!important;border-color:#88414c!important}.input{width:100%;background:#0b1727;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;font:14px Tahoma;margin:5px 0 9px}.form{width:min(390px,100%);text-align:right}.form label{font-size:12px;color:var(--muted)}.room{font-family:monospace;letter-spacing:4px;font-size:30px;color:var(--gold);background:#0a1726;padding:12px 18px;border-radius:13px;margin:12px 0;direction:ltr}.canvas-wrap{position:relative;max-width:430px;margin:auto}.canvas-wrap canvas{width:100%;display:block;border:4px solid #304a66;border-radius:18px;background:#2c3c40}.hud{display:flex;gap:8px;justify-content:space-between;margin-bottom:9px}.stat{flex:1;background:#10243a;border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center;font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:18px;margin-top:2px}.controls{display:flex;direction:ltr;justify-content:center;gap:25px;margin-top:11px}.control{width:90px;height:54px;background:#17304d;color:#fff;border:1px solid #426486;border-radius:15px;font-size:28px;touch-action:none}.board{width:min(560px,100%);margin:auto}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #28405a;padding:12px 4px}.row b{color:var(--gold)}.empty{color:var(--muted);padding:18px}.hidden{display:none!important}@media(max-width:760px){body{padding:10px}.page{display:block}.panel{margin-bottom:12px}.menu{grid-template-columns:repeat(3,1fr)}.menu button{font-size:12px;padding:10px;text-align:center}.help{display:none}.screen{min-height:560px}.top{margin-bottom:10px}}
</style></head><body><main class="app"><header class="top"><div class="logo">ROAD <span>RIVALS</span></div><div class="guest" id="guest">Guest • connecting…</div></header><section class="page"><aside class="panel"><h2>اللعب</h2><nav class="menu"><button data-mode="computer" class="active">ضد الكمبيوتر</button><button data-mode="online">أونلاين</button><button data-mode="scores">الترتيب</button></nav><div class="help">العب كضيف بدون تسجيل. في وضع الأونلاين أنشئ غرفة أو ادخل بكود غرفة صديقك.<br><br>التحكم: الأسهم ← → أو A / D، وعلى الهاتف أزرار التحكم أسفل الطريق.</div></aside><section class="game-card"><div class="mode-title"><h1 id="heading">سباق فردي</h1><small id="subheading">تجاوز السيارات وسجل أعلى نتيجة</small></div><div id="view"></div></section></section></main>
<script>
(()=>{
const cfg={apiKey:'AIzaSyBFyORpVWPjxpHcnS0UVfRbTictRQPl8aQ',authDomain:'ebraa-f53bb.firebaseapp.com',projectId:'ebraa-f53bb',storageBucket:'ebraa-f53bb.firebasestorage.app',messagingSenderId:'1042267482279',appId:'1:1042267482279:web:5f93cae979492b31b71382'};
let db=null,uid='guest-'+Math.random().toString(36).slice(2,8),online=false,unsub=null,mode='computer',playerName=localStorage.getItem('rr-name')||'Guest',roomId='',opponent=null;
try{firebase.initializeApp(cfg);db=firebase.firestore();firebase.auth().signInAnonymously().then(u=>{uid=u.user.uid;online=true;guest.textContent='Guest • '+playerName}).catch(()=>guest.textContent='Guest • offline mode')}catch(e){guest.textContent='Guest • offline mode'}
const $=id=>document.getElementById(id),view=$('view'),guest=$('guest'),heading=$('heading'),sub=$('subheading');
function setHead(a,b){heading.textContent=a;sub.textContent=b}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function saveName(){playerName=($('playerName')?.value||'Guest').trim().slice(0,18)||'Guest';localStorage.setItem('rr-name',playerName);guest.textContent='Guest • '+playerName}
function menu(){document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function homeComputer(){setHead('سباق فردي','واجه الكمبيوتر وسجل أعلى نتيجة');view.innerHTML=`<div class="screen"><div><div style="font-size:70px">🏎️</div><h1>جاهز للسباق؟</h1><p>تجنب السيارات، ارفع سرعتك، وحاول تحطيم أفضل نتيجة.</p><div class="form"><label>اسمك (اختياري)</label><input class="input" id="playerName" value="${esc(playerName)}" maxlength="18"></div><div class="actions"><button class="btn primary" id="playComputer">ابدأ ضد الكمبيوتر</button><button class="btn" id="goOnline">العب أونلاين</button></div></div></div>`;$('playerName').onchange=saveName;$('playComputer').onclick=()=>{saveName();startRace('computer')};$('goOnline').onclick=()=>{mode='online';menu();renderMode()}}
function onlineHome(){setHead('سباق أونلاين','غرفة خاصة ضد لاعب حقيقي');view.innerHTML=`<div class="screen"><div class="form"><div style="font-size:60px;text-align:center">🌐</div><h1 style="text-align:center">سباق أونلاين</h1><p style="text-align:center">أنشئ غرفة وشارك الكود مع صديقك، أو ادخل كود غرفة موجودة.</p><label>اسمك</label><input class="input" id="playerName" value="${esc(playerName)}" maxlength="18"><div class="actions"><button class="btn primary" id="create">إنشاء غرفة</button><button class="btn" id="join">دخول غرفة</button></div><input class="input hidden" id="roomCode" placeholder="اكتب كود الغرفة" maxlength="6" style="text-transform:uppercase;text-align:center;letter-spacing:4px"><button class="btn primary hidden" id="joinNow" style="width:100%">دخول</button><p id="onlineMsg" style="font-size:12px;color:var(--muted)">${online?'متصل بالخدمة':'الخدمة غير متصلة حاليًا'}</p></div></div>`;$('playerName').onchange=saveName;$('create').onclick=()=>{saveName();createRoom()};$('join').onclick=()=>{$('roomCode').classList.remove('hidden');$('joinNow').classList.remove('hidden');$('join').classList.add('hidden')};$('joinNow').onclick=()=>{saveName();joinRoom(($('roomCode').value||'').trim().toUpperCase())}}
async function createRoom(){if(!online)return alert('لا يوجد اتصال بخدمة الأونلاين الآن');roomId=Math.random().toString(36).slice(2,8).toUpperCase();await db.collection('roadRivalsRooms').doc(roomId).set({status:'waiting',createdAt:Date.now(),players:{[uid]:{name:playerName,x:160,score:0,alive:true,ready:true}}});lobby()}
async function joinRoom(code){if(!online)return alert('لا يوجد اتصال بخدمة الأونلاين الآن');if(!/^[A-Z0-9]{6}$/.test(code))return alert('اكتب كودًا من 6 أحرف');let ref=db.collection('roadRivalsRooms').doc(code),snap=await ref.get();if(!snap.exists)return alert('الغرفة غير موجودة');roomId=code;await ref.set({status:'playing',players:{[uid]:{name:playerName,x:160,score:0,alive:true,ready:true}}},{merge:true});lobby()}
function lobby(){setHead('غرفة '+roomId,'انتظر اللاعب الآخر');view.innerHTML=`<div class="screen"><div><div style="font-size:54px">🏁</div><h1>شارك الكود</h1><div class="room">${roomId}</div><p id="lobbyText">جاري انتظار لاعب آخر…</p><button class="btn danger" id="leave">خروج من الغرفة</button></div></div>`;$('leave').onclick=()=>{if(unsub)unsub();mode='online';renderMode()};unsub=db.collection('roadRivalsRooms').doc(roomId).onSnapshot(s=>{let d=s.data()||{},ps=Object.entries(d.players||{});if(ps.length>=2){opponent=ps.find(([id])=>id!==uid)?.[1]||null;$('lobbyText').textContent='تم العثور على خصم! يبدأ السباق…';setTimeout(()=>startRace('online'),700)}})}
function startRace(type){if(unsub){unsub();unsub=null}mode=type;let score=0,alive=true,paused=false,last=performance.now(),spawn=0,offset=0,traffic=[],xpos=158,oppX=158;setHead(type==='online'?'مواجهة أونلاين':'سباق ضد الكمبيوتر',type==='online'?'الخصم يظهر باللون الأزرق':'السيارات الحمراء يتحكم فيها الكمبيوتر');view.innerHTML=`<div class="hud"><div class="stat">النقاط<b id="gScore">0</b></div><div class="stat">السرعة<b id="gSpeed">1</b></div><div class="stat">الخصم<b id="gOpp">${type==='online'?'متصل':'AI'}</b></div></div><div class="canvas-wrap"><canvas id="canvas" width="360" height="560"></canvas></div><div class="controls"><button class="control" id="ctlL">◀</button><button class="control" id="ctlR">▶</button></div><p style="text-align:center;color:var(--muted);font-size:12px">تجنب السيارات الصفراء وابقَ في الطريق</p>`;const c=$('canvas'),ctx=c.getContext('2d');function road(){ctx.fillStyle='#267542';ctx.fillRect(0,0,360,560);ctx.fillStyle='#343c41';ctx.fillRect(43,0,274,560);ctx.fillStyle='#d4d8c9';ctx.fillRect(43,0,5,560);ctx.fillRect(312,0,5,560);ctx.fillStyle='#fff3b0';for(let y=-50+offset%72;y<560;y+=72)ctx.fillRect(177,y,6,40)}function drawCar(px,py,col){ctx.fillStyle='#1118';ctx.fillRect(px+3,py+7,38,66);ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(px,py,44,70,9);ctx.fill();ctx.fillStyle='#152535';ctx.fillRect(px+7,py+12,30,19);ctx.fillRect(px+7,py+43,30,13);ctx.fillStyle='#fff8';ctx.fillRect(px+4,py+6,7,10);ctx.fillRect(px+33,py+6,7,10);ctx.fillStyle='#202020';ctx.fillRect(px-3,py+15,5,17);ctx.fillRect(px+42,py+15,5,17);ctx.fillRect(px-3,py+45,5,17);ctx.fillRect(px+42,py+45,5,17)}function add(){traffic.push({x:[61,123,185,247][Math.floor(Math.random()*4)],y:-80,v:155+score*.3})}function hit(a,b){return a+38>b.x+5&&a+6<b.x+39&&486<b.y+65&&542>b.y+5}function draw(){road();traffic.forEach(o=>drawCar(o.x,o.y,'#e9535b'));if(type==='online'&&opponent)drawCar(oppX,475,'#4dd4e8');drawCar(xpos,486,'#ffd447')}function finish(){alive=false;if(unsub){unsub();unsub=null}if(score>Number(localStorage.getItem('rr-best')||0))localStorage.setItem('rr-best',score);if(online&&db)db.collection('roadRivalsScores').add({name:playerName,score,mode:type,createdAt:Date.now()}).catch(()=>{});view.innerHTML=`<div class="screen"><div><div style="font-size:60px">${type==='online'?'🏆':'💥'}</div><h1>${type==='online'?'انتهت المواجهة':'انتهى السباق'}</h1><p>نتيجتك: <b style="color:var(--gold);font-size:25px">${score}</b></p><div class="actions"><button class="btn primary" id="again">العب مرة أخرى</button><button class="btn" id="back">القائمة الرئيسية</button></div></div></div>`;$('again').onclick=()=>startRace(type);$('back').onclick=()=>{mode=type==='online'?'online':'computer';renderMode()}}
function tick(t){if(!alive)return;let dt=Math.min((t-last)/1000,.04);last=t;if(!paused){offset+=160*dt;spawn-=dt;if(spawn<=0){add();spawn=Math.max(.4,1-score/6000)}traffic.forEach(o=>o.y+=o.v*dt);traffic=traffic.filter(o=>o.y<590);if(traffic.some(o=>hit(xpos,o))){finish();return}score+=Math.floor(dt*14);$('gScore').textContent=score;$('gSpeed').textContent=1+Math.floor(score/400);if(type==='online'&&db&&Date.now()%100<20)db.collection('roadRivalsRooms').doc(roomId).set({players:{[uid]:{name:playerName,x:xpos,score,alive:true,ts:Date.now()}}},{merge:true}).catch(()=>{});if(type==='online'&&opponent){oppX=opponent.x||oppX;$('gOpp').textContent=opponent.name+' '+(opponent.score||0)}draw()}requestAnimationFrame(tick)}function move(d){if(alive&&!paused)xpos=Math.max(50,Math.min(266,xpos+d*18))}[['ctlL',-1],['ctlR',1]].forEach(([id,d])=>{$(id).onpointerdown=e=>{e.preventDefault();move(d)}});addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(e.key===' '){paused=!paused}});draw();requestAnimationFrame(tick);if(type==='online')unsub=db.collection('roadRivalsRooms').doc(roomId).onSnapshot(s=>{let ps=(s.data()||{}).players||{};opponent=Object.entries(ps).find(([id])=>id!==uid)?.[1]||opponent})}
function scores(){setHead('الترتيب','أفضل نتائج لاعبي Road Rivals');view.innerHTML='<div class="screen"><div class="board"><h1>🏆 أفضل اللاعبين</h1><p id="scoreMsg">جاري تحميل النتائج…</p><div id="rows"></div><button class="btn" id="scoreBack">رجوع</button></div></div>';$('scoreBack').onclick=()=>{mode='computer';menu();renderMode()};if(!online){$('scoreMsg').textContent='سجّل نتيجتك أونلاين لتظهر هنا';return}db.collection('roadRivalsScores').orderBy('score','desc').limit(10).get().then(s=>{$('scoreMsg').textContent='';$('rows').innerHTML=s.docs.map((d,i)=>`<div class="row"><span>${i+1}. ${esc(d.data().name||'Guest')}</span><b>${d.data().score||0}</b></div>`).join('')||'<div class="empty">لا توجد نتائج بعد</div>'}).catch(()=>{$('scoreMsg').textContent='تعذر تحميل الترتيب حاليًا'})}
function renderMode(){menu();if(mode==='computer')homeComputer();else if(mode==='online')onlineHome();else scores()}document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderMode()});renderMode();
})();
</script></body></html>
